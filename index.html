<!DOCTYPE html>
<html lang="ko" data-theme="liquid-green">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agora Capital</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Liquid Glass Green Theme */
    :root[data-theme="liquid-green"] {
      --bg-gradient: linear-gradient(135deg, #74b832 0%, #5d9828 50%, #437119 100%);
      --card-bg: rgba(62, 107, 20, 0.78);
      --card-border: rgba(255, 255, 255, 0.3);
      --text: #ffffff;
      --text-muted: #d2f8a6;
      --primary: #a3f345;
      --primary-hover: #8ee031;
      --danger: #ef4444;
      --header-bg: rgba(45, 80, 14, 0.88);
      --input-bg: rgba(30, 56, 9, 0.65);
      --glass-glow: 0 12px 32px 0 rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      padding-bottom: 50px;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: var(--header-bg);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--glass-glow);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
    }

    .btn {
      padding: 0.50rem 1rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-primary { background-color: var(--primary); color: #1e3a05; }
    .btn-primary:hover { background-color: var(--primary-hover); color: #000; }
    .btn-danger { background-color: var(--danger); color: white; }
    .btn-outline { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--card-border); color: var(--text); }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.2); }

    .container { max-width: 1150px; margin: 2rem auto; padding: 0 1rem; }

    /* Top Row Layout */
    .dashboard-top-row {
      display: grid;
      grid-template-columns: 1fr 160px;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .top-banner-card {
      background: var(--card-bg);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-top: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 32px;
      padding: 1.5rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--glass-glow);
    }

    .banner-main-title {
      font-size: 2.4rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -1px;
    }

    .top-profile-box {
      background: var(--card-bg);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-top: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--glass-glow);
      transition: transform 0.2s ease, border-color 0.2s ease;
      padding: 1rem;
    }
    .top-profile-box:hover {
      transform: scale(1.04);
      border-color: var(--primary);
    }

    .user-avatar-lg {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--primary);
      box-shadow: 0 0 18px rgba(163, 243, 69, 0.45);
    }

    /* 3 Large Vertical Columns Grid */
    .dashboard-bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1.25rem;
    }

    .vertical-column-card {
      background: var(--card-bg);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-top: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 32px;
      padding: 1.5rem;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--glass-glow);
    }

    .column-header-title {
      font-size: 2rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 1.25rem;
      text-align: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 0.75rem;
    }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-muted); }
    .form-control {
      width: 100%;
      padding: 0.65rem 0.8rem;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 12px;
      outline: none;
    }

    /* Stores List inside Column */
    .store-item-card {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .store-item-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    /* Modals */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 20, 5, 0.82);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      background: rgba(45, 80, 14, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      width: 100%;
      max-width: 600px;
      padding: 1.75rem;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--glass-glow);
    }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 0.65rem 0.5rem; border-bottom: 1px solid var(--card-border); font-size: 0.9rem; }
    th { color: var(--text-muted); }

    .review-box { background: var(--input-bg); border-radius: 10px; padding: 0.75rem; margin-top: 0.5rem; border: 1px solid var(--card-border); }
    .reaction-btn { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text); padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <i class="fa-solid fa-leaf"></i>
      <span>AGORA CAPITAL</span>
    </div>

    <div class="header-actions">
      <button class="btn btn-outline" onclick="openModal('modal-settings')"><i class="fa-solid fa-gear"></i> 설정</button>
      <button id="admin-login-btn" class="btn btn-outline" onclick="openModal('modal-admin')"><i class="fa-solid fa-user-shield"></i> 관리자</button>
      <button id="logout-btn" class="btn btn-danger hidden" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</button>
    </div>
  </header>

  <div class="container">

    <!-- LOGIN VIEW -->
    <div id="view-login" class="vertical-column-card" style="max-width: 400px; margin: 3rem auto; min-height: auto;">
      <h2 class="column-header-title">계좌 로그인</h2>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>계좌번호</label>
          <input type="text" id="login-acc" class="form-control" placeholder="예: 101-001" required>
        </div>
        <div class="form-group">
          <label>비밀번호 (PIN)</label>
          <input type="password" id="login-pin" class="form-control" placeholder="비밀번호" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">로그인</button>
      </form>
    </div>

    <!-- MAIN HOME DASHBOARD VIEW -->
    <div id="view-dashboard" class="hidden">
      
      <!-- Top Banner: 아고라 메인 + Profile Box -->
      <div class="dashboard-top-row">
        <div class="top-banner-card">
          <div>
            <h1 class="banner-main-title">아고라 메인</h1>
            <p style="font-size: 1rem; color: var(--text-muted); margin-top: 0.2rem;">
              <span id="dash-name" style="color:#fff; font-weight:700;">-</span> (<span id="dash-acc">-</span>)
            </p>
          </div>
          <div style="text-align: right;">
            <p style="font-size: 0.85rem; color: var(--text-muted);">현재 잔액</p>
            <h1 id="dash-balance" style="font-size: 2.2rem; color: var(--primary);">0 G</h1>
          </div>
        </div>

        <div class="top-profile-box" onclick="openModal('modal-avatar')" title="프로필 사진 변경">
          <img id="dash-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="user-avatar-lg">
          <span style="font-size:0.75rem; color: var(--text-muted); margin-top:0.4rem; font-weight:600;">프로필 변경</span>
        </div>
      </div>

      <!-- 3 Main Columns: 마켓 / 주식 / 은행 -->
      <div class="dashboard-bottom-grid">
        
        <!-- Column 1: 마켓 (Market) -->
        <div class="vertical-column-card">
          <h2 class="column-header-title">마켓</h2>
          <button class="btn btn-primary" style="width:100%; justify-content:center; margin-bottom:1rem;" onclick="openModal('modal-create-store')">
            <i class="fa-solid fa-plus"></i> 상점 개설 (1,000 G)
          </button>
          <div id="market-store-list" style="flex-grow: 1; overflow-y: auto;"></div>
        </div>

        <!-- Column 2: 주식 (Stock) -->
        <div class="vertical-column-card">
          <h2 class="column-header-title">주식</h2>
          <div style="flex-grow: 1; overflow-y: auto;">
            <table>
              <thead>
                <tr><th>상점명</th><th>주가</th><th>매매</th></tr>
              </thead>
              <tbody id="stock-list"></tbody>
            </table>
          </div>
        </div>

        <!-- Column 3: 은행 (Bank) -->
        <div class="vertical-column-card">
          <h2 class="column-header-title">은행</h2>
          
          <div style="margin-bottom: 1.25rem;">
            <h4 style="color:var(--primary); margin-bottom:0.5rem;"><i class="fa-solid fa-paper-plane"></i> 계좌 송금</h4>
            <form onsubmit="handleTransfer(event)">
              <div class="form-group">
                <input type="text" id="trans-acc" class="form-control" placeholder="받는 계좌번호" required>
              </div>
              <div class="form-group">
                <input type="number" id="trans-amt" class="form-control" placeholder="금액 (G)" min="1" required>
              </div>
              <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">송금하기</button>
            </form>
          </div>

          <div>
            <h4 style="color:var(--primary); margin-bottom:0.5rem;"><i class="fa-solid fa-chart-pie"></i> 나의 주식 지분율</h4>
            <table style="width:100%;">
              <thead><tr><th>종목</th><th>보유</th><th>지분율</th></tr></thead>
              <tbody id="portfolio-list"></tbody>
            </table>
          </div>
        </div>

      </div>

    </div>

    <!-- ADMIN VIEW -->
    <div id="view-admin" class="hidden">
      <div class="vertical-column-card" style="min-height: auto;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2 class="column-header-title" style="margin:0; border:none;">관리자 대시보드</h2>
          <button class="btn btn-outline" onclick="logout()">관리자 종료</button>
        </div>

        <div style="margin: 1.5rem 0; background: var(--input-bg); padding: 1rem; border-radius: 16px; border:1px solid var(--card-border);">
          <h4>신규 계좌 생성</h4>
          <form onsubmit="adminCreateAcc(event)" style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem;">
            <input type="text" id="adm-name" class="form-control" placeholder="이름" style="flex:1" required>
            <input type="text" id="adm-acc" class="form-control" placeholder="계좌번호" style="flex:1" required>
            <input type="text" id="adm-pin" class="form-control" placeholder="비밀번호" style="flex:1" required>
            <input type="number" id="adm-bal" class="form-control" placeholder="잔액" style="flex:1" value="1000" required>
            <button type="submit" class="btn btn-primary">생성</button>
          </form>
        </div>

        <h3>전체 계좌 목록</h3>
        <table>
          <thead>
            <tr><th>이름</th><th>계좌번호</th><th>비밀번호</th><th>잔액</th><th>관리</th></tr>
          </thead>
          <tbody id="admin-acc-list"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- STORE DETAIL MODAL -->
  <div id="modal-store-detail" class="modal-overlay">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h3 id="modal-store-title" style="font-size:1.4rem; color:var(--primary); font-weight:800;">상점 상세보기</h3>
        <button class="btn btn-outline" onclick="closeModal('modal-store-detail')">&times;</button>
      </div>

      <div id="store-owner-actions" class="hidden" style="margin-bottom: 1rem; display:flex; gap:0.5rem;">
        <button class="btn btn-primary" onclick="openModal('modal-add-item')"><i class="fa-solid fa-plus"></i> 상품 추가</button>
        <button class="btn btn-danger" onclick="eraseCurrentStore()"><i class="fa-solid fa-trash"></i> 상점 폐업 (삭제)</button>
      </div>

      <h4>판매 상품 목록</h4>
      <div id="store-products-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:0.75rem;"></div>
    </div>
  </div>

  <!-- PRODUCT POPUP MODAL -->
  <div id="modal-product-popup" class="modal-overlay">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h3 id="pop-product-title" style="font-size:1.3rem; color:var(--primary); font-weight:800;">상품 상세 정보</h3>
        <button class="btn btn-outline" onclick="closeModal('modal-product-popup')">&times;</button>
      </div>

      <img id="pop-product-img" src="" style="width:100%; height:200px; object-fit:cover; border-radius:16px; margin-bottom:1rem; background:var(--input-bg);">

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h2 id="pop-product-price" style="color:var(--primary);">0 G</h2>
        <div style="display:flex; gap:0.5rem;">
          <button class="reaction-btn" onclick="reactProduct('like')"><i class="fa-solid fa-thumbs-up"></i> <span id="pop-likes">0</span></button>
          <button class="reaction-btn" onclick="reactProduct('dislike')"><i class="fa-solid fa-thumbs-down"></i> <span id="pop-dislikes">0</span></button>
        </div>
      </div>

      <div style="display:flex; gap:0.5rem; margin-bottom:1.5rem;">
        <button class="btn btn-primary" style="flex:1; justify-content:center; font-size:1rem;" onclick="buyActiveProduct()"><i class="fa-solid fa-cart-shopping"></i> 구매하기</button>
        <button id="pop-erase-btn" class="btn btn-danger hidden" onclick="eraseActiveProduct()"><i class="fa-solid fa-trash"></i> 삭제하기</button>
      </div>

      <h4 style="margin-bottom:0.5rem;">상품 리뷰</h4>
      <form onsubmit="handlePostReview(event)" style="margin-bottom:1rem;">
        <div style="display:flex; gap:0.5rem; margin-bottom:0.5rem;">
          <select id="review-rating" class="form-control" style="width:130px;">
            <option value="5">⭐⭐⭐⭐⭐</option>
            <option value="4">⭐⭐⭐⭐</option>
            <option value="3">⭐⭐⭐</option>
            <option value="2">⭐⭐</option>
            <option value="1">⭐</option>
          </select>
          <input type="text" id="review-text" class="form-control" placeholder="리뷰 작성..." required>
        </div>
        <button type="submit" class="btn btn-outline" style="width:100%; justify-content:center;">리뷰 등록</button>
      </form>

      <div id="pop-review-list"></div>
    </div>
  </div>

  <!-- PROFILE PICTURE MODAL -->
  <div id="modal-avatar" class="modal-overlay">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h3 style="font-size:1.3rem; color:var(--primary); font-weight:800;">프로필 사진 변경</h3>
        <button class="btn btn-outline" onclick="closeModal('modal-avatar')">&times;</button>
      </div>
      <form onsubmit="handleUpdateAvatar(event)">
        <div class="form-group">
          <label>이미지 URL</label>
          <input type="url" id="avatar-url-input" class="form-control" placeholder="https://example.com/avatar.jpg" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">프로필 저장</button>
      </form>
    </div>
  </div>

  <!-- CREATE STORE MODAL -->
  <div id="modal-create-store" class="modal-overlay">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h3 style="font-size:1.3rem; color:var(--primary); font-weight:800;">신규 상점 개설 (1,000 G)</h3>
        <button class="btn btn-outline" onclick="closeModal('modal-create-store')">&times;</button>
      </div>
      <form onsubmit="handleCreateStore(event)">
        <div class="form-group">
          <label>상점 이름</label>
          <input type="text" id="store-name" class="form-control" required>
        </div>
        <div class="form-group">
          <label>발행 주식 수량 (주)</label>
          <input type="number" id="store-shares" class="form-control" min="10" value="100" required>
        </div>
        <div class="form-group">
          <label>주당 초기 가격 (G)</label>
          <input type="number" id="store-price" class="form-control" min="1" value="10" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">개설 및 주식 발행</button>
      </form>
    </div>
  </div>

  <!-- ADD ITEM MODAL -->
  <div id="modal-add-item" class="modal-overlay">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h3 style="font-size:1.3rem; color:var(--primary); font-weight:800;">상품 등록</h3>
        <button class="btn btn-outline" onclick="closeModal('modal-add-item')">&times;</button>
      </div>
      <form onsubmit="handleAddItem(event)">
        <div class="form-group">
          <label>상품명</label>
          <input type="text" id="item-name" class="form-control" required>
        </div>
        <div class="form-group">
          <label>가격 (G)</label>
          <input type="number" id="item-price" class="form-control" min="1" required>
        </div>
        <div class="form-group">
          <label>이미지 URL (선택사항)</label>
          <input type="url" id="item-img" class="form-control" placeholder="https://example.com/photo.jpg">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">등록하기</button>
      </form>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="modal-settings" class="modal-overlay">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h3 style="font-size:1.3rem; color:var(--primary); font-weight:800;"><i class="fa-solid fa-palette"></i> 테마 설정</h3>
        <button class="btn btn-outline" onclick="closeModal('modal-settings')">&times;</button>
      </div>
      <div class="form-group">
        <label>테마 선택</label>
        <select class="form-control">
          <option value="liquid-green">리퀴드 그린 (Liquid Green)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ADMIN AUTH MODAL -->
  <div id="modal-admin" class="modal-overlay">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h3 style="font-size:1.3rem; color:var(--primary); font-weight:800;">관리자 로그인</h3>
        <button class="btn btn-outline" onclick="closeModal('modal-admin')">&times;</button>
      </div>
      <form onsubmit="handleAdminAuth(event)">
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" id="admin-pass" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">인증</button>
      </form>
    </div>
  </div>

  <script>
    const defaultAvatar = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150";

    let accounts = JSON.parse(localStorage.getItem('ag_accs_v8')) || [
      { name: "민수", account: "101-001", pin: "1234", balance: 5000, avatar: defaultAvatar, shares: {} },
      { name: "지아", account: "101-002", pin: "1234", balance: 12000, avatar: defaultAvatar, shares: {} }
    ];

    let stores = JSON.parse(localStorage.getItem('ag_stores_v8')) || [
      { id: "S1", name: "아고라 메인 상점", owner: "101-001", totalShares: 100, price: 50, totalSales: 0, items: [] }
    ];

    let currentUser = null;
    let activeStoreId = null;
    let activeItemId = null;
    let isAdmin = false;

    function save() {
      localStorage.setItem('ag_accs_v8', JSON.stringify(accounts));
      localStorage.setItem('ag_stores_v8', JSON.stringify(stores));
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function handleLogin(e) {
      e.preventDefault();
      const acc = document.getElementById('login-acc').value;
      const pin = document.getElementById('login-pin').value;
      const user = accounts.find(a => a.account === acc && a.pin === pin);

      if (user) {
        currentUser = user;
        isAdmin = false;
        document.getElementById('view-login').classList.add('hidden');
        document.getElementById('logout-btn').classList.remove('hidden');
        document.getElementById('admin-login-btn').classList.add('hidden');
        updateDash();
        document.getElementById('view-dashboard').classList.remove('hidden');
      } else {
        alert("로그인 정보가 틀렸습니다.");
      }
    }

    function updateDash() {
      const userImg = currentUser.avatar || defaultAvatar;

      document.getElementById('dash-name').innerText = currentUser.name;
      document.getElementById('dash-acc').innerText = currentUser.account;
      document.getElementById('dash-balance').innerText = `${currentUser.balance.toLocaleString()} G`;
      document.getElementById('dash-avatar').src = userImg;

      renderMarketStores();
      renderStockList();
      renderPortfolio();
    }

    function renderMarketStores() {
      const box = document.getElementById('market-store-list');
      box.innerHTML = '';

      if (stores.length === 0) {
        box.innerHTML = '<p style="color:var(--text-muted); text-align:center;">등록된 상점이 없습니다.</p>';
        return;
      }

      stores.forEach(s => {
        box.innerHTML += `
          <div class="store-item-card" onclick="openStoreDetail('${s.id}')">
            <h4 style="color:var(--primary); font-size:1.1rem;">${s.name}</h4>
            <p style="font-size:0.8rem; color:var(--text-muted); margin-top:0.2rem;">상품: ${s.items.length}개 | 주가: ${s.price} G</p>
          </div>
        `;
      });
    }

    function renderStockList() {
      const tbody = document.getElementById('stock-list');
      tbody.innerHTML = '';
      stores.forEach(s => {
        tbody.innerHTML += `
          <tr>
            <td><strong>${s.name}</strong></td>
            <td style="color:var(--primary); font-weight:700;">${s.price} G</td>
            <td>
              <button class="btn btn-primary" style="padding:0.2rem 0.5rem; font-size:0.75rem;" onclick="tradeStock('${s.id}', 'buy')">매수</button>
              <button class="btn btn-outline" style="padding:0.2rem 0.5rem; font-size:0.75rem;" onclick="tradeStock('${s.id}', 'sell')">매도</button>
            </td>
          </tr>
        `;
      });
    }

    function renderPortfolio() {
      const tbody = document.getElementById('portfolio-list');
      tbody.innerHTML = '';
      let count = 0;

      stores.forEach(s => {
        const owned = (currentUser.shares && currentUser.shares[s.id]) || 0;
        if (owned > 0) {
          count++;
          const pct = ((owned / s.totalShares) * 100).toFixed(1);
          tbody.innerHTML += `<tr><td>${s.name}</td><td>${owned}주</td><td><strong style="color:var(--primary);">${pct}%</strong></td></tr>`;
        }
      });

      if (count === 0) tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color: var(--text-muted);">보유 주식 없음</td></tr>';
    }

    function handleUpdateAvatar(e) {
      e.preventDefault();
      const newUrl = document.getElementById('avatar-url-input').value;
      currentUser.avatar = newUrl;
      save();
      updateDash();
      closeModal('modal-avatar');
      alert("프로필 사진이 변경되었습니다!");
    }

    function handleTransfer(e) {
      e.preventDefault();
      const targetAcc = document.getElementById('trans-acc').value;
      const amt = parseInt(document.getElementById('trans-amt').value);

      const target = accounts.find(a => a.account === targetAcc);
      if (!target || target.account === currentUser.account) return alert("유효하지 않은 계좌입니다.");
      if (currentUser.balance < amt) return alert("잔액이 부족합니다.");

      currentUser.balance -= amt;
      target.balance += amt;
      save();
      updateDash();
      alert("송금 완료!");
    }

    // Store & Items Logic
    function handleCreateStore(e) {
      e.preventDefault();
      if (currentUser.balance < 1000) return alert("개설 비용 (1,000 G)이 부족합니다.");

      currentUser.balance -= 1000;
      const sharesCount = parseInt(document.getElementById('store-shares').value);
      const initialPrice = parseInt(document.getElementById('store-price').value);
      const storeId = "S" + Date.now();

      stores.push({
        id: storeId,
        name: document.getElementById('store-name').value,
        owner: currentUser.account,
        totalShares: sharesCount,
        price: initialPrice,
        totalSales: 0,
        items: []
      });

      if (!currentUser.shares) currentUser.shares = {};
      currentUser.shares[storeId] = sharesCount;

      save();
      closeModal('modal-create-store');
      updateDash();
      alert("상점이 개설되었습니다!");
    }

    function openStoreDetail(storeId) {
      activeStoreId = storeId;
      const store = stores.find(s => s.id === storeId);
      document.getElementById('modal-store-title').innerText = store.name;

      const actions = document.getElementById('store-owner-actions');
      if (currentUser && (currentUser.account === store.owner || isAdmin)) {
        actions.classList.remove('hidden');
      } else {
        actions.classList.add('hidden');
      }

      renderStoreProducts();
      openModal('modal-store-detail');
    }

    function renderStoreProducts() {
      const store = stores.find(s => s.id === activeStoreId);
      const grid = document.getElementById('store-products-grid');
      grid.innerHTML = '';

      if (!store.items || store.items.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-muted); grid-column:1/-1;">등록된 상품이 없습니다.</p>';
        return;
      }

      store.items.forEach(item => {
        grid.innerHTML += `
          <div style="background:var(--input-bg); border:1px solid var(--card-border); border-radius:14px; overflow:hidden; cursor:pointer;" onclick="openProductPopup('${item.id}')">
            <img src="${item.img || 'https://via.placeholder.com/300'}" style="width:100%; height:120px; object-fit:cover;">
            <div style="padding:0.6rem;">
              <h4>${item.name}</h4>
              <p style="color:var(--primary); font-weight:700;">${item.price.toLocaleString()} G</p>
            </div>
          </div>
        `;
      });
    }

    function handleAddItem(e) {
      e.preventDefault();
      const store = stores.find(s => s.id === activeStoreId);

      store.items.push({
        id: "I" + Date.now(),
        name: document.getElementById('item-name').value,
        price: parseInt(document.getElementById('item-price').value),
        img: document.getElementById('item-img').value || "https://via.placeholder.com/300",
        likes: 0,
        dislikes: 0,
        reviews: []
      });

      save();
      closeModal('modal-add-item');
      renderStoreProducts();
      updateDash();
    }

    function openProductPopup(itemId) {
      activeItemId = itemId;
      const store = stores.find(s => s.id === activeStoreId);
      const item = store.items.find(i => i.id === itemId);

      document.getElementById('pop-product-title').innerText = item.name;
      document.getElementById('pop-product-img').src = item.img || 'https://via.placeholder.com/300';
      document.getElementById('pop-product-price').innerText = `${item.price.toLocaleString()} G`;
      document.getElementById('pop-likes').innerText = item.likes || 0;
      document.getElementById('pop-dislikes').innerText = item.dislikes || 0;

      const eraseBtn = document.getElementById('pop-erase-btn');
      if (currentUser && (currentUser.account === store.owner || isAdmin)) {
        eraseBtn.classList.remove('hidden');
      } else {
        eraseBtn.classList.add('hidden');
      }

      renderPopupReviews();
      openModal('modal-product-popup');
    }

    function reactProduct(type) {
      const store = stores.find(s => s.id === activeStoreId);
      const item = store.items.find(i => i.id === activeItemId);

      if (type === 'like') item.likes = (item.likes || 0) + 1;
      if (type === 'dislike') item.dislikes = (item.dislikes || 0) + 1;

      save();
      document.getElementById('pop-likes').innerText = item.likes;
      document.getElementById('pop-dislikes').innerText = item.dislikes;
    }

    function buyActiveProduct() {
      const store = stores.find(s => s.id === activeStoreId);
      const item = store.items.find(i => i.id === activeItemId);

      if (currentUser.balance < item.price) return alert("잔액이 부족합니다.");

      currentUser.balance -= item.price;
      store.totalSales += item.price;
      store.price += Math.max(1, Math.ceil(item.price / 100));

      const ownerAcc = accounts.find(a => a.account === store.owner);
      if (ownerAcc) ownerAcc.balance += item.price;

      save();
      updateDash();
      alert(`[${item.name}] 구매가 완료되었습니다!`);
    }

    function eraseActiveProduct() {
      if (confirm("이 상품을 정말 삭제하시겠습니까?")) {
        const store = stores.find(s => s.id === activeStoreId);
        store.items = store.items.filter(i => i.id !== activeItemId);
        save();
        closeModal('modal-product-popup');
        renderStoreProducts();
        updateDash();
      }
    }

    function handlePostReview(e) {
      e.preventDefault();
      const store = stores.find(s => s.id === activeStoreId);
      const item = store.items.find(i => i.id === activeItemId);

      if (!item.reviews) item.reviews = [];

      item.reviews.push({
        author: currentUser ? currentUser.name : "익명",
        rating: parseInt(document.getElementById('review-rating').value),
        text: document.getElementById('review-text').value
      });

      save();
      document.getElementById('review-text').value = '';
      renderPopupReviews();
    }

    function renderPopupReviews() {
      const store = stores.find(s => s.id === activeStoreId);
      const item = store.items.find(i => i.id === activeItemId);
      const list = document.getElementById('pop-review-list');
      list.innerHTML = '';

      if (!item.reviews || item.reviews.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted);">작성된 리뷰가 없습니다.</p>';
        return;
      }

      item.reviews.forEach(r => {
        list.innerHTML += `
          <div class="review-box">
            <div style="display:flex; justify-content:space-between; font-weight:600;">
              <span>${r.author}</span>
              <span>${'⭐'.repeat(r.rating)}</span>
            </div>
            <p style="margin-top:0.25rem; font-size:0.9rem;">${r.text}</p>
          </div>
        `;
      });
    }

    function eraseCurrentStore() {
      if (confirm("이 상점을 폐업하고 영구 삭제하시겠습니까?")) {
        stores = stores.filter(s => s.id !== activeStoreId);
        save();
        closeModal('modal-store-detail');
        updateDash();
      }
    }

    // Stock Market Logic
    function tradeStock(storeId, type) {
      const store = stores.find(s => s.id === storeId);
      if (!currentUser.shares) currentUser.shares = {};

      if (type === 'buy') {
        if (currentUser.balance < store.price) return alert("잔액이 부족합니다.");
        currentUser.balance -= store.price;
        currentUser.shares[storeId] = (currentUser.shares[storeId] || 0) + 1;
        store.price += 1;
      } else {
        if (!currentUser.shares[storeId] || currentUser.shares[storeId] <= 0) return alert("보유 주식이 없습니다.");
        currentUser.balance += store.price;
        currentUser.shares[storeId] -= 1;
        store.price = Math.max(1, store.price - 1);
      }

      save();
      updateDash();
    }

    // Admin Controls
    function handleAdminAuth(e) {
      e.preventDefault();
      if (document.getElementById('admin-pass').value === "20140204") {
        isAdmin = true;
        closeModal('modal-admin');
        document.getElementById('view-login').classList.add('hidden');
        document.getElementById('view-admin').classList.remove('hidden');
        renderAdmin();
      } else alert("비밀번호 불일치");
    }

    function renderAdmin() {
      const tbody = document.getElementById('admin-acc-list');
      tbody.innerHTML = '';
      accounts.forEach(a => {
        tbody.innerHTML += `
          <tr>
            <td>${a.name}</td>
            <td>${a.account}</td>
            <td>${a.pin}</td>
            <td>${a.balance} G</td>
            <td>
              <button class="btn btn-outline" style="padding:0.2rem 0.5rem;" onclick="editAccBal('${a.account}')">수정</button>
              <button class="btn btn-danger" style="padding:0.2rem 0.5rem;" onclick="eraseAcc('${a.account}')">삭제</button>
            </td>
          </tr>
        `;
      });
    }

    function adminCreateAcc(e) {
      e.preventDefault();
      accounts.push({
        name: document.getElementById('adm-name').value,
        account: document.getElementById('adm-acc').value,
        pin: document.getElementById('adm-pin').value,
        balance: parseInt(document.getElementById('adm-bal').value),
        shares: {}
      });
      save();
      renderAdmin();
      alert("계좌 추가 완료");
    }

    function editAccBal(accNum) {
      const acc = accounts.find(a => a.account === accNum);
      const val = prompt("새 잔액 입력:", acc.balance);
      if (val !== null) {
        acc.balance = parseInt(val);
        save();
        renderAdmin();
      }
    }

    function eraseAcc(accNum) {
      if (confirm("이 계좌를 정말 영구 삭제하시겠습니까?")) {
        accounts = accounts.filter(a => a.account !== accNum);
        save();
        renderAdmin();
      }
    }

    function logout() {
      currentUser = null;
      isAdmin = false;
      location.reload();
    }
  </script>
</body>
</html>
